services:
  # 1. Layanan Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: e_monitor_anak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d e_monitor_anak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Layanan Backend Express Anda
  backend:
    build: .
    container_name: cobain
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:123@db:5432/e_monitor_anak"
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
